<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HQOverlord — Agent Operations</title><link rel="stylesheet" href="/style.css"></head>
<body><main id="screen-game" class="screen active">
<header id="topbar"><div class="brand">HQOVERLORD<small>AGENT OPERATIONS</small></div><label class="business-label">BUSINESS<select id="business" aria-label="Business"></select></label><div class="instrument">RECORDED MODEL SPEND<strong id="spend">—</strong></div><div class="instrument signal"><span id="link-lamp"></span><strong id="connection">Connecting</strong><small id="sig">Awaiting authoritative state</small></div></header>
<aside id="left" class="panel"><h2>CREW<button id="crew-hide" aria-label="Hide crew">HIDE</button></h2><input id="crew-search" type="search" placeholder="Find crew" aria-label="Find crew"><ul id="crew"></ul><p id="crew-sum"></p><h2>JOBS</h2><ul id="workstreams"></ul></aside>
<section id="stage-wrap" aria-label="Station"><canvas id="stage" tabindex="0" aria-label="Agent stations. Select a crew member in the crew rail or click their station." aria-describedby="stage-summary"></canvas><p id="stage-summary" class="sr-only"></p><div class="cam-hud"><span id="cam-rec">LINK</span><span id="cam-feed">STATION / LIVE STATE</span></div><button id="crew-show" hidden>CREW</button><div class="camera-controls"><button id="zoom-out" aria-label="Zoom out">-</button><button id="camera-reset">FIT</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="cinema">CINEMA</button></div><div id="world-ticker">Waiting for HQ runtime</div></section>
<aside id="chat-panel" class="panel"><h2>COMMS<span id="chat-status">NO SELECTION</span><button id="comms-expand" aria-label="Expand COMMS">EXPAND</button></h2><div id="comms-idbar"><img src="/assets/agent.svg" alt="" width="48" height="58"><div><select id="comms-agent-select" aria-label="Selected agent"></select><p id="comms-agent-model"></p></div><button id="agent-details" aria-label="Agent dossier">i</button></div><p id="notice" role="status"></p><div id="chat-log" aria-label="Selected agent recorded activity"></div><form id="job-composer"><label for="job-objective">ASSIGN A JOB</label><textarea id="job-objective" maxlength="12000" required placeholder="Describe work for the selected agent"></textarea><button id="create-job" data-mutation>QUEUE JOB</button><small id="execution-mode"></small></form></aside>
<footer id="bottombar"><nav id="dock-groups" aria-label="Operator dock"></nav><div class="bb-right">REVENUE <strong id="revenue">£0.00</strong><span>DURABLE STATE</span></div></footer></main>
<section id="operator-window" class="term" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden><header><h2 id="panel-title"></h2><button id="panel-close" aria-label="Close window">×</button></header><div id="panel-content"></div></section>
<script type="module" src="/app.js"></script></body></html>
